spring.application.name=Spring-boot-rest-api-application-test

# 1. Use In-Memory H2 for speed and isolation (prevents file locks)
# DB_CLOSE_DELAY=-1 keeps the data alive as long as the test context is running
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Force Hibernate to CREATE the tables (Essential to fix your error)
# 'create-drop' creates the schema at start and cleans up after tests
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Standard JPA settings for 2026
# We disable the manual script generation actions to avoid permission errors in CI/CD
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=generated-schema.sql

# 4. Debugging & Formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Disable H2 Console for tests to save resources
spring.h2.console.enabled=false

# 6. Test specific file path (if your logic still needs a file reference)
product.backup.file=target/test-products_backup.json

spring.jpa.defer-datasource-initialization=true