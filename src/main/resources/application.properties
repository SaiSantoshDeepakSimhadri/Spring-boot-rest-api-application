spring.application.name=Spring-boot-rest-api-application

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- H2 DataSource ---
spring.datasource.url=jdbc:h2:file:./data/LearnSBDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate Schema Generation ---
# Tell Hibernate to generate DDL (create tables)
spring.jpa.hibernate.ddl-auto=update

# Instruct JPA to both generate and execute schema in DB
spring.jpa.properties.javax.persistence.schema-generation.database.action=none

# Generate schema from entities in memory AND write it to a file (for inspection)
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=update
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=generated-schema.sql

# Preserve entity field order for DDL generation
spring.jpa.properties.hibernate.order_columns=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# (Optional) For debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
product.backup.file=products_backup.json
